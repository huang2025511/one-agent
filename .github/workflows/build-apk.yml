name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release 名称（留空用 tag 名）'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_client/one_agent_client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (CMake + NDK for flutter_live2d native build)
        run: |
          # flutter_live2d 要求 cmake;3.10.2，我们先尝试安装，若失败则用软链接
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "cmake;3.10.2" > /dev/null 2>&1 || true
            
          # 如果安装失败，创建软链接（确保 bin 目录下有 cmake 和 ninja）
          if [ ! -d "$ANDROID_HOME/cmake/3.10.2/bin" ] || [ ! -f "$ANDROID_HOME/cmake/3.10.2/bin/cmake" ]; then
            mkdir -p $ANDROID_HOME/cmake/3.10.2/bin
            # 查找已安装的 cmake 版本（通常是 3.31.5）
            SOURCE_DIR=$(ls -d $ANDROID_HOME/cmake/*/bin 2>/dev/null | head -1 | xargs dirname 2>/dev/null)
            if [ -n "$SOURCE_DIR" ]; then
              cp -r "$SOURCE_DIR/bin/"* $ANDROID_HOME/cmake/3.10.2/bin/ 2>/dev/null || true
              # 或者创建软链接
              SRC_BIN="$SOURCE_DIR/bin"
              ln -sf $SRC_BIN/cmake $ANDROID_HOME/cmake/3.10.2/bin/cmake 2>/dev/null || true
              ln -sf $SRC_BIN/ninja $ANDROID_HOME/cmake/3.10.2/bin/ninja 2>/dev/null || true
            fi
          fi

          # 安装项目需要的 NDK (27.2.12479018 是 flutter_live2d 需要的版本)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.2.12479018" > /dev/null 2>&1 || true

          echo "=== 验证 CMake 3.10.2 ==="
          ls -la $ANDROID_HOME/cmake/3.10.2/bin/
          $ANDROID_HOME/cmake/3.10.2/bin/cmake --version
          echo "=== 已安装的 cmake 版本 ==="
          ls $ANDROID_HOME/cmake/
          echo "=== 已安装的 NDK 版本 ==="
          ls $ANDROID_HOME/ndk/ 2>/dev/null || echo "无"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate freezed/json code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Get version
        id: version
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "name=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             one-agent-pet-${{ steps.version.outputs.name }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-agent-pet-apk
          path: flutter_client/one_agent_client/one-agent-pet-*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.release_name || steps.version.outputs.tag }}
          files: flutter_client/one_agent_client/one-agent-pet-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 构建完成后自动同步代码到 Gitee（保持 Gitee 为最新主仓库）──
      - name: Sync to Gitee
        if: success()
        run: |
          cd $GITHUB_WORKSPACE
          git remote add gitee "https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/huang20260511/one-agent.git" 2>/dev/null || true
          git push gitee HEAD:main --force-with-lease 2>&1 | sed "s/oauth2:[^@]*@/oauth2:***@/g"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
