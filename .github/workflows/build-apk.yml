name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release 名称（留空用 tag 名）'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_client/one_agent_client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (CMake + NDK for flutter_live2d native build)
        run: |
          # flutter_live2d 原本要求 cmake;3.10.2，但 AGP 8.x 与旧版 CMake Server 握手失败。
          # 解决方案：安装 cmake;3.22.1（稳定版，兼容 AGP 8.x），
          # 然后修改 flutter_live2d 插件的 build.gradle 使其使用此版本。
          
          # 安装所需 CMake 版本
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "cmake;3.22.1" > /dev/null 2>&1 || true
            
          # 安装项目需要的 NDK (27.2.12479018 是 flutter_live2d 需要的版本)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.2.12479018" > /dev/null 2>&1 || true

          echo "=== 验证 CMake 3.22.1 ==="
          $ANDROID_HOME/cmake/3.22.1/bin/cmake --version
          echo "=== 已安装的 cmake 版本 ==="
          ls $ANDROID_HOME/cmake/
          echo "=== 已安装的 NDK 版本 ==="
          ls $ANDROID_HOME/ndk/ 2>/dev/null || echo "无"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Patch flutter_live2d CMake version (3.10.2 → 3.22.1)
        run: |
          # flutter_live2d 要求 cmake 3.10.2，但 AGP 8.x 与之不兼容
          # 我们修改插件的 build.gradle.kts 来使用已安装的 cmake 3.22.1
          LIVE2D_DIR=$(find $PUB_CACHE -type d -name "flutter_live2d-*" 2>/dev/null | head -1)
          if [ -z "$LIVE2D_DIR" ]; then
            LIVE2D_DIR=$(find $HOME/.pub-cache -type d -name "flutter_live2d-*" 2>/dev/null | head -1)
          fi
          
          if [ -n "$LIVE2D_DIR" ]; then
            echo "Found flutter_live2d at: $LIVE2D_DIR"
            # flutter_live2d 使用 build.gradle.kts (Kotlin DSL)
            GRADLE_FILE="$LIVE2D_DIR/android/build.gradle.kts"
            if [ ! -f "$GRADLE_FILE" ]; then
              GRADLE_FILE="$LIVE2D_DIR/android/build.gradle"
            fi
            
            if [ -f "$GRADLE_FILE" ]; then
              echo "Patching $GRADLE_FILE"
              echo "=== Before patch ==="
              cat "$GRADLE_FILE"
              
              # Kotlin DSL: version = "3.10.2" -> version = "3.22.1"
              # Groovy DSL: version "3.10.2" -> version "3.22.1"
              sed -i 's/version[[:space:]]*=[[:space:]]*"3.10.2"/version = "3.22.1"/g' "$GRADLE_FILE"
              sed -i 's/version[[:space:]]*"3.10.2"/version "3.22.1"/g' "$GRADLE_FILE"
              # 也处理可能的单引号
              sed -i "s/version[[:space:]]*=[[:space:]]*'3.10.2'/version = '3.22.1'/g" "$GRADLE_FILE"
              sed -i "s/version[[:space:]]*'3.10.2'/version '3.22.1'/g" "$GRADLE_FILE"
              
              echo "=== After patch ==="
              cat "$GRADLE_FILE"
            else
              echo "Warning: build.gradle(.kts) not found at $LIVE2D_DIR/android/"
              ls -la "$LIVE2D_DIR/android/" 2>/dev/null || echo "No android directory"
            fi
          else
            echo "Warning: flutter_live2d not found in pub cache"
          fi

      - name: Generate freezed/json code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Get version
        id: version
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "name=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             one-agent-pet-${{ steps.version.outputs.name }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-agent-pet-apk
          path: flutter_client/one_agent_client/one-agent-pet-*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.release_name || steps.version.outputs.tag }}
          files: flutter_client/one_agent_client/one-agent-pet-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 上传 APK 到 Gitee Release（保持 Gitee 也有构建产物）──
      - name: Upload APK to Gitee Release
        id: gitee_release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          APK_FILE=$(ls one-agent-pet-*.apk | head -1)
          APK_SIZE=$(du -h "$APK_FILE" | awk '{print $1}')
          GH_DOWNLOAD="https://github.com/huang2025511/one-agent/releases/download/${TAG_NAME}/${APK_FILE}"
          echo "Tag: $TAG_NAME | APK: $APK_FILE | Size: $APK_SIZE"

          # 1. 在 Gitee 创建 Release（body 包含 GitHub 下载链接作为备选）
          echo ">>> 创建 Gitee Release..."
          RESPONSE=$(curl --connect-timeout 30 --max-time 60 -s -w "\n%{http_code}" -X POST \
            "https://gitee.com/api/v5/repos/huang20260511/one-agent/releases" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"tag_name\": \"${TAG_NAME}\",
              \"name\": \"${TAG_NAME}\",
              \"body\": \"APK 构建产物（自动同步自 GitHub Actions）\\n\\n**GitHub 下载链接:** ${GH_DOWNLOAD}\",
              \"target_commitish\": \"main\"
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"

          RELEASE_ID=$(echo "$BODY" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo ">>> 创建失败，尝试获取已有的 Release..."
            RESPONSE=$(curl --connect-timeout 30 --max-time 60 -s \
              "https://gitee.com/api/v5/repos/huang20260511/one-agent/releases/tags/${TAG_NAME}?access_token=${GITEE_TOKEN}")
            RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
            if [ -z "$RELEASE_ID" ]; then
              echo "ERROR: 无法获取 Gitee Release: $RESPONSE"
              exit 1
            fi
          fi

          echo ">>> Gitee Release ID: $RELEASE_ID"
          echo "release_id=${RELEASE_ID}" >> $GITHUB_OUTPUT

          # 2. 上传 APK 附件到 Gitee Release（跨境上传可能慢，超时 600s）
          echo ">>> 开始上传 APK (${APK_SIZE})，最长等待 10 分钟..."
          UPLOAD_RESP=$(curl --connect-timeout 30 --max-time 600 --retry 2 --retry-delay 10 -s -w "\n%{http_code}" \
            -X POST "https://gitee.com/api/v5/repos/huang20260511/one-agent/releases/${RELEASE_ID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@${APK_FILE}")

          UPLOAD_HTTP_CODE=$(echo "$UPLOAD_RESP" | tail -1)
          UPLOAD_BODY=$(echo "$UPLOAD_RESP" | sed '$d')
          echo "Upload HTTP Status: $UPLOAD_HTTP_CODE"

          ASSET_URL=$(echo "$UPLOAD_BODY" | jq -r '.browser_download_url // empty' 2>/dev/null)
          if [ -n "$ASSET_URL" ]; then
            echo "✅ APK 已上传到 Gitee: $ASSET_URL"
            echo "asset_url=${ASSET_URL}" >> $GITHUB_OUTPUT
          else
            echo "⚠️ APK 上传到 Gitee 失败 (HTTP $UPLOAD_HTTP_CODE)"
            echo "⚠️ 请通过 GitHub 下载: ${GH_DOWNLOAD}"
            # 不 exit 1，因为 continue-on-error 会处理
            exit 1
          fi

      - name: Gitee Release Result
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${{ steps.gitee_release.outcome }}" = "success" ]; then
            echo "✅ Gitee Release 创建 + APK 上传成功"
          else
            echo "⚠️ Gitee APK 上传失败（跨境网络超时），但 Gitee Release 已创建"
            echo "⚠️ Gitee Release 描述中已包含 GitHub 下载链接"
            echo "⚠️ GitHub Release: https://github.com/huang2025511/one-agent/releases/tag/${GITHUB_REF#refs/tags/}"
          fi

      # ── 构建完成后自动同步代码到 Gitee（保持 Gitee 为最新主仓库）──
      - name: Sync to Gitee
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          git remote add gitee "https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/huang20260511/one-agent.git" 2>/dev/null || true
          git push gitee HEAD:main --force 2>&1 | sed "s/oauth2:[^@]*@/oauth2:***@/g"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
