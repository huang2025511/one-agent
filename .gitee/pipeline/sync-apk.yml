# Gitee Go Pipeline: 同步 GitHub Release APK 到 Gitee Release
#
# 背景：GitHub Actions runner 在海外，国内 Gitee 服务器接收 58MB APK 跨境上传经常超时。
#       用户在国内下载 GitHub Release 也很慢，需要 Gitee Release 提供 APK 镜像。
#
# 方案：在 Gitee Go Pipeline（国内 runner）上从 GitHub Release 下载 APK，再上传到 Gitee Release。
#       整条链路：GitHub CDN → 国内 Gitee runner → Gitee Release，全程国内网络。
#
# 启用步骤：
#   1. 仓库设置 -> 服务 -> Gitee Go -> 启用 Pipeline
#   2. 仓库设置 -> Secrets -> 新增 Secret：
#        - GH_TOKEN: GitHub Personal Access Token (需要 repo 权限)
#   3. 此 Pipeline 已配置手动触发，每次 GitHub Release 创建后，在 Gitee Go 页面手动点"运行"
#   4. 或编辑此文件，将 manual 改为 push 自动触发（见下方注释）

name: sync-apk-from-github
displayName: "同步 APK: GitHub Release → Gitee Release"

# 手动触发：每次 GitHub Release 创建后，在 Gitee 仓库 -> 服务 -> Gitee Go -> 流水线 中点"运行"
manual:
  description: "从 GitHub Release 下载最新 APK 并上传到 Gitee Release"

# 如需自动触发（每次 push 到 main 时自动同步），将上面的 manual 块替换为：
# trigger:
#   push:
#     branches:
#       - main

env:
  GH_REPO: huang2025511/one-agent
  GITEE_REPO: huang20260511/one-agent

stages:
  - name: sync_apk
    displayName: "下载并上传 APK"
    steps:
      - name: download_apk
        displayName: "从 GitHub Release 下载最新 APK"
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: GH_TOKEN 未配置"
            echo "请在 Gitee 仓库 -> 设置 -> Secrets 中添加 GH_TOKEN（GitHub Personal Access Token）"
            exit 1
          fi

          echo ">>> 获取 GitHub 最新 Release (含 'pet' 关键字)..."
          # 获取最近 5 个 Release，找出包含 .apk 资产且 tag 含 pet 的
          RELEASE_INFO=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${GH_REPO}/releases?per_page=10")

          TAG=$(echo "$RELEASE_INFO" | jq -r '.[] | select(.tag_name | contains("pet")) | .tag_name' | head -1)
          if [ -z "$TAG" ]; then
            echo "ERROR: 未找到含 pet 的 Release"
            exit 1
          fi
          echo ">>> GitHub Tag: $TAG"

          APK_NAME=$(echo "$RELEASE_INFO" | jq -r --arg tag "$TAG" \
            '.[] | select(.tag_name == $tag) | .assets[] | select(.name | endswith(".apk")) | .name' | head -1)
          if [ -z "$APK_NAME" ]; then
            echo "ERROR: Release 中未找到 APK 资产"
            exit 1
          fi
          echo ">>> APK 文件名: $APK_NAME"

          # 找 assets 中 apk 的 browser_download_url（用 GitHub 原生 URL 走 CDN 加速）
          APK_URL=$(echo "$RELEASE_INFO" | jq -r --arg tag "$TAG" --arg name "$APK_NAME" \
            '.[] | select(.tag_name == $tag) | .assets[] | select(.name == $name) | .browser_download_url' | head -1)
          echo ">>> APK URL: $APK_URL"

          echo ">>> 下载 APK..."
          # 通过 gh-proxy.com 或 jsdelivr CDN 加速下载（如果直连 GitHub 慢的话）
          # 先试直连，失败则用 gh-proxy.com 国内镜像
          if ! curl -L --connect-timeout 30 --max-time 300 \
               -H "Authorization: token $GH_TOKEN" \
               "$APK_URL" -o "$APK_NAME" 2>/dev/null; then
            echo ">>> 直连 GitHub 失败，尝试 gh-proxy.com 镜像..."
            MIRROR_URL="https://gh-proxy.com/${APK_URL}"
            curl -L --connect-timeout 30 --max-time 600 \
              -H "Authorization: token $GH_TOKEN" \
              "$MIRROR_URL" -o "$APK_NAME"
          fi

          ls -lh "$APK_NAME"
          echo "TAG=$TAG" > .env_sync
          echo "APK_NAME=$APK_NAME" >> .env_sync

      - name: upload_to_gitee
        displayName: "上传 APK 到 Gitee Release"
        run: |
          set -e
          source .env_sync
          if [ -z "$GITEE_TOKEN" ]; then
            echo "ERROR: GITEE_TOKEN 未配置"
            echo "GITEE_TOKEN 是 Gitee Go 内置变量，无需手动配置。如果失败请检查仓库设置。"
            exit 1
          fi

          echo ">>> 检查 Gitee Release ${TAG}..."
          RELEASE_ID=$(curl -s \
            "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" | \
            jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo ">>> 创建 Gitee Release..."
            RESPONSE=$(curl -s -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases" \
              -H "Content-Type: application/json;charset=UTF-8" \
              -d "{
                \"access_token\": \"${GITEE_TOKEN}\",
                \"tag_name\": \"${TAG}\",
                \"name\": \"${TAG}\",
                \"body\": \"APK 构建产物（自动同步自 GitHub Release）\",
                \"target_commitish\": \"main\"
              }")
            RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
            if [ -z "$RELEASE_ID" ]; then
              echo "ERROR: 创建 Release 失败: $RESPONSE"
              exit 1
            fi
          fi
          echo ">>> Gitee Release ID: $RELEASE_ID"

          echo ">>> 上传 ${APK_NAME} 到 Gitee Release..."
          UPLOAD_RESP=$(curl -s -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@${APK_NAME}")

          echo "上传响应: $UPLOAD_RESP"

          ASSET_URL=$(echo "$UPLOAD_RESP" | jq -r '.browser_download_url // empty')
          if [ -n "$ASSET_URL" ]; then
            echo "✅ APK 已上传到 Gitee: $ASSET_URL"
          else
            echo "❌ APK 上传失败"
            exit 1
          fi
