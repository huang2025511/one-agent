name: one_agent_client
description: One-Agent mobile client — full-featured Flutter app for Android/iOS
publish_to: 'none'
version: 1.0.84+2084

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP & SSE
  dio: ^5.4.3

  # Local storage
  shared_preferences: ^2.2.3

  # UI
  flutter_markdown: ^0.7.1
  flutter_slidable: ^3.1.0

  # Utilities
  intl: ^0.19.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # 应用内更新（OTA）
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  path_provider: ^2.1.3

  # 桌宠：安卓悬浮窗 + 权限请求
  flutter_overlay_window: ^0.4.5
  permission_handler: ^11.3.1

  # 桌宠：Live2D 模型渲染（Cubism SDK, .moc3 3.0-5.3）
  flutter_live2d: ^1.0.2

  # 桌宠：模型管理（导入 zip / 打开下载页 / 文件选择）
  file_picker: ^8.1.2
  archive: ^3.6.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # 内置免费 Live2D 模型 - mao 猫（8个表情 + 7个动作）
    - assets/models/mao/
    - assets/models/mao/expressions/
    - assets/models/mao/motions/
    - assets/models/mao/mao_pro.4096/
    # 用户后续导入的模型目录
    - assets/models/
