name: one_agent_client
description: One-Agent mobile client — full-featured Flutter app for Android/iOS
publish_to: 'none'
version: 1.0.95+4094

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP & SSE
  dio: ^5.4.3

  # Local storage
  shared_preferences: ^2.2.3

  # UI
  flutter_markdown: ^0.7.1
  flutter_slidable: ^3.1.0

  # Utilities
  intl: ^0.19.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # 应用内更新（OTA）
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  path_provider: ^2.1.3

  # 桌宠 Live2D 模型管理（ZIP 导入 / 文件选择 / 官网下载跳转）
  file_picker: ^8.0.0
  url_launcher: ^6.2.6
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # 桌宠悬浮窗 Web 渲染资源（原生 WebView 加载，pixi-live2d-display）
    - assets/live2d_web/
    # 内置 Live2D 模型（Hiyori，官方免费示例模型）
    - assets/models/hiyori/
    - assets/models/hiyori/Hiyori.2048/
    - assets/models/hiyori/motions/
